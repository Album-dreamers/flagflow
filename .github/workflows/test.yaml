# The upstream workflows live in server/.github and sdk/.github, where
# GitHub doesn't run them; these are the same steps from the repo root.
name: Test

on:
  push:
    branches:
      - main
      - ci-*
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lets
        uses: lets-cli/lets-action@v1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/ui/package-lock.json

      - name: Build UI
        working-directory: server/ui
        run: |
          npm ci
          npm run build

      # builds the test image, starts postgres-test, runs pytest in compose
      - name: Run server tests
        run: lets test

  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: pdm-project/setup-pdm@v3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install tox tox-gh-actions tox-pdm

      - name: Test with tox
        run: tox
